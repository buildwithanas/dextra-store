<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Adire &amp; Co. Catalog</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="hero">
    <div class="container">
      <h1 class="hero__title" id="store-title"></h1>
      <p class="hero__text" id="store-tagline"></p>
    </div>
  </header>

  <div class="toolbar">
    <div class="container toolbar__inner">
      <div class="filters" id="filters"></div>
      <button class="button button--accent" id="open-cart">
        Cart (<span id="cart-count">0</span>)
      </button>
    </div>
  </div>

  <main class="catalog">
    <div class="container">
      <div class="product-grid" id="product-grid"></div>
    </div>
  </main>

  <dialog class="cart" id="cart-dialog">
    <div class="cart__panel">
      <header class="cart__header">
        <h2 class="cart__title">Your order</h2>
        <button class="icon-button" id="close-cart" aria-label="Close cart">&times;</button>
      </header>

      <div class="cart__lines" id="cart-lines"></div>

      <div class="cart__form">
        <input class="field" id="customer-name" placeholder="Your name" autocomplete="name">
        <input class="field" id="customer-address" placeholder="Delivery address or pickup" autocomplete="street-address">
        <textarea class="field" id="customer-note" rows="2" placeholder="Note to seller (optional)"></textarea>
      </div>

      <div class="cart__total">
        <span>Total</span>
        <span id="cart-total"></span>
      </div>

      <a class="button button--whatsapp" id="whatsapp-link" href="#" target="_blank" rel="noopener" aria-disabled="true">
        Send order on WhatsApp
      </a>
      <p class="cart__hint">WhatsApp opens with your order written out. Payment and delivery are agreed in the chat.</p>
    </div>
  </dialog>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
